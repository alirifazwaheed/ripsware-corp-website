# /etc/nginx/sites-available/ripsware.com
#
# HTTP-only to start. Run `certbot --nginx -d ripsware.com -d www.ripsware.com`
# after this is in place; certbot rewrites this file to add the TLS server block
# and the port 80 -> 443 redirect.
#
# This droplet hosts other vhosts (malas.ripsware.com). This block matches purely on
# server_name and is not marked default_server, so it neither shadows them nor
# inherits their traffic.

server {
    listen 80;
    listen [::]:80;
    server_name ripsware.com www.ripsware.com;

    # `current` is a symlink the deploy workflow flips atomically.
    root /var/www/ripsware/current;
    index index.html;

    access_log /var/log/nginx/ripsware.access.log;
    error_log  /var/log/nginx/ripsware.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Angular client-side routing: unknown paths must return index.html so the
    # router can handle them, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the only unhashed entry point - it must never be cached,
    # or browsers keep pointing at bundles from a previous release.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Build output is content-hashed (outputHashing: all), so it's immutable.
    # `expires` emits its own Cache-Control, so setting both here would send two
    # conflicting headers - the max-age lives in the add_header instead.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # src/assets is copied verbatim - filenames are stable, so cache modestly.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # Source maps should not be in a production build; deny them if one slips in.
    location ~* \.map$ {
        return 404;
    }

    location = /favicon.ico {
        expires 30d;
        access_log off;
        log_not_found off;
    }
}
